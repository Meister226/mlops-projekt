[project]
name = "mlops-projekt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.162.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "optuna-integration>=5.0.0",
    "plotly>=7.1.0",
    "pre-commit>=4.7.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mlops-projekt = "mlops_projekt:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
